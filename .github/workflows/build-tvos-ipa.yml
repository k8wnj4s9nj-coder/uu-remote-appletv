# Build unsigned tvOS IPA on GitHub-hosted macOS (no local Mac required).
# Sideload later with atvloadly (Linux, same LAN as Apple TV) or AltStore-style tools.
name: Build tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AppleTV/**'
      - 'Protocol/**'
      - '.github/workflows/build-tvos-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Resolve packages
        working-directory: AppleTV
        run: |
          xcodebuild -resolvePackageDependencies \
            -project UURemoteTV.xcodeproj \
            -scheme UURemoteTV || true

      - name: Archive (unsigned CODE_SIGNING_ALLOWED=NO)
        working-directory: AppleTV
        run: |
          set -euo pipefail
          mkdir -p ../build
          xcodebuild archive \
            -project UURemoteTV.xcodeproj \
            -scheme UURemoteTV \
            -destination 'generic/platform=tvOS' \
            -archivePath ../build/UURemoteTV.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee ../build/xcodebuild.log
          # Keep going even if signing-related warnings appear; fail on real errors
          grep -E 'ARCHIVE SUCCEEDED|ARCHIVE FAILED|error:' ../build/xcodebuild.log | tail -20

      - name: Pack IPA
        run: |
          set -euo pipefail
          ARCHIVE=build/UURemoteTV.xcarchive
          APP=$(find "$ARCHIVE/Products/Applications" -name '*.app' | head -1)
          test -n "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../UURemoteTV-unsigned.ipa Payload)
          ls -lh build/UURemoteTV-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UURemoteTV-unsigned-ipa
          path: build/UURemoteTV-unsigned.ipa
          if-no-files-found: error
